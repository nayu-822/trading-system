# 本番 API 18080 を使う少額確認用サンプルです。
# 実注文が市場へ送信される可能性があるため、利用前に設定値を必ず再確認してください。
# このファイルは自動参照されません。内容を確認して config/app.yaml へ反映してください。

mode: mock
trading_mode: live
live_enabled: true
data_source_mode: api
log_level: INFO
rest_poll_interval_sec: 5
push_enabled: false

# 最初は最小数量から始めてください。
max_order_quantity: 1
trade_symbols:
  - "1306"
position_reconciliation_enabled: true
position_average_price_tolerance: 0.01
kabu_api_environment: live
api_timeout_sec: 5

# API パスワードは環境変数から参照します。YAML に直接書かないでください。
token_env_name: KABU_API_PASSWORD_LIVE

# 本番 API 18080 を使います。trade_symbols と max_order_quantity を必ず確認してください。
# kabu_api_base_url: http://localhost:18080/kabusapi
snapshot_enabled: false
snapshot_dir: snapshots
snapshot_interval_sec: 60
snapshot_max_generations: 3
snapshot_debounce_sec: 5
recovery_enabled: false
recovery_mode: manual
startup_reconcile_enabled: false
